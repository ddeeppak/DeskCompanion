# XcodeGen config: the GitHub cloud Mac turns this into an Xcode project.
name: DeskCompanion

options:
  deploymentTarget:
    iOS: "15.0"            # iPhone 7 Plus max is iOS 15.8.x

targets:
  DeskCompanion:
    type: application
    platform: iOS
    sources:
      - path: Sources
        excludes:
          - "Info-extra.plist"
    scheme: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.deskcompanion.u7k3q2
        PRODUCT_NAME: DeskCompanion
        MARKETING_VERSION: "0.5.2"
        CURRENT_PROJECT_VERSION: "8"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        IPHONEOS_DEPLOYMENT_TARGET: "15.0"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon   # paw icon (Sources/Assets.xcassets)
        INFOPLIST_KEY_CFBundleDisplayName: "Desk Companion"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        # Landscape only, both directions (Home button left or right)
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_UIStatusBarHidden: YES
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        # Permission texts (step 2)
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Used to show the weather, sunrise and sunset where your desk is. Only an approximate location is sent to the free Open-Meteo weather service."
        INFOPLIST_KEY_NSCalendarsUsageDescription: "Shows today's events on the Home and Today screens."
        INFOPLIST_KEY_NSRemindersUsageDescription: "Shows, adds and ticks off your tasks from Reminders."
        # "My sounds": files can be copied in with iTunes File Sharing on the PC (key lives in Info-extra.plist)
        INFOPLIST_FILE: Sources/Info-extra.plist
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Used to hear your voice commands. Nothing is recorded or saved."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Turns your voice into text for commands like timers and reminders. Apple may process speech on its servers."
        INFOPLIST_KEY_NSMotionUsageDescription: "Used to read the barometer for the air pressure trend on the Home screen."
        # Sideloadly signs the app later with your Apple ID
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
